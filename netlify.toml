[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "20"

# Query-string crawl-budget fix (2026-08-25): any request to "/" carrying a
# WordPress-style ?p= parameter (this site is not WordPress; these are stray
# crawled/linked URLs) gets a real 301 to /de/ instead of being served the
# homepage with HTTP 200. Confirmed root cause of ~14.6k "Alternative page
# with proper canonical" entries in GSC eating crawl budget at ~700x site size.
[[redirects]]
  from = "/"
  to = "/de/"
  status = 301
  force = true
  query = {p = ":p"}

# Security headers
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "SAMEORIGIN"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
